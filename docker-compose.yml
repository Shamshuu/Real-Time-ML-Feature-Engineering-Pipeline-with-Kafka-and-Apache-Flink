services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  init-kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      bash -c "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --replication-factor 1 --partitions 3 --topic user-events &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic content-metadata --config cleanup.policy=compact &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --replication-factor 1 --partitions 1 --topic feature-store --config cleanup.policy=compact &&
      echo 'Topics created successfully'
      "


  flink-jobmanager:
    build:
      context: ./flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 10

  flink-taskmanager:
    build:
      context: ./flink
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 10
    healthcheck:
      test: ["CMD-SHELL", "grep -q '10' <(curl -s http://flink-jobmanager:8081/slots | grep -o '\"total\":10')"]
      interval: 10s
      timeout: 5s
      retries: 10

  data-producer:
    build:
      context: ./producer
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - USER_EVENTS_TOPIC=user-events
      - CONTENT_METADATA_TOPIC=content-metadata
      - SIMULATION_ACCELERATION_FACTOR=60
      - LATE_EVENT_PERCENTAGE=0.05
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0)"] # Simple check
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "8501:8501"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FEATURE_STORE_TOPIC=feature-store
      - TEST_USER_ID=user_123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  flink-job-submitter:
    build:
      context: ./flink
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command: -c "sleep 20 && /opt/flink/bin/flink run -m flink-jobmanager:8081 -py /opt/flink/job.py"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - USER_EVENTS_TOPIC=user-events
      - CONTENT_METADATA_TOPIC=content-metadata
      - FEATURE_STORE_TOPIC=feature-store
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
